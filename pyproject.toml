[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "menu-reader-lab"
version = "0.1.0"
description = "Mede qualidade, custo e latência de leitores de cardápio por IA (nuvem e local) em cardápios sintéticos com gabarito."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pillow>=10",
    "numpy>=1.26",
    "reportlab>=4",
    "rapidfuzz>=3.6",
    "jsonschema>=4.20",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
openai = ["openai>=1.60"]
dev = ["pytest>=8"]

[project.scripts]
menu-lab = "menu_reader_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/menu_reader_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
